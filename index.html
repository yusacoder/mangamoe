
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Moe - Yeni Sitemiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background:
        radial-gradient(ellipse at 50% 0%, #38204d 0%, transparent 55%),
        #08080c;
    font-family: 'Inter', sans-serif;
    color: white;
}

.announcement {
    width: 100%;
    max-width: 620px;
    padding: 55px 35px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 25px;
    background: linear-gradient(145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.015));
    box-shadow: 0 25px 90px rgba(0,0,0,.5);
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 45px;
    text-decoration: none;
    color: white;
}

.brand-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(135deg,#a855f7,#6d28d9);
    font-size: 23px;
}

.brand-name {
    text-align: left;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.brand-name small {
    display: block;
    margin-top: 4px;
    color: #a78bfa;
    font-size: 9px;
    letter-spacing: 3px;
}

.status {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 30px;
    background: rgba(239,68,68,.12);
    color: #ff7777;
    border: 1px solid rgba(239,68,68,.2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(30px, 6vw, 43px);
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: -1.5px;
    margin-bottom: 17px;
}

h1 span {
    color: #a78bfa;
}

.description {
    color: #aaa7b5;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 35px;
}

.website {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 19px;
    border-radius: 14px;
    background: linear-gradient(100deg,#7c3aed,#9333ea);
    color: white;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 10px 35px rgba(124,58,237,.25);
    transition: .25s;
}

.website:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(124,58,237,.4);
}

.instagram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
    padding: 12px 18px;
    color: #e7d9ff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: .2s;
}

.instagram i {
    font-size: 19px;
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.instagram:hover {
    color: white;
}

.footer {
    margin-top: 40px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: #686575;
    font-size: 11px;
    letter-spacing: .5px;
}

@media(max-width:480px) {
    .announcement {
        padding: 40px 22px;
    }
}
</style>
</head>

<body>

<main class="announcement">

    <a href="https://www.eternalproduction.net"
       class="brand">
        <span class="brand-icon">
            <i class="fa-solid fa-infinity"></i>
        </span>
        <span class="brand-name">
            ETERNAL PRODUCTION
            <small>ANIME & DIGITAL MEDIA</small>
        </span>
    </a>

    <div>
        <span class="status">
            <i class="fa-solid fa-circle-info"></i>
            BİLGİLENDİRME
        </span>
    </div>

    <h1>
        MANGA MOE<br>
        <span>KAPANMIŞTIR.</span>
    </h1>

    <p class="description">
        Manga Moe hizmetlerine son verilmiştir.<br>
        Yeni projelerimiz ve içeriklerimiz için<br>
        Eternal Production'a bekleriz.
    </p>

    <a class="website"
       href="https://www.eternalproduction.net"
       target="_blank"
       rel="noopener noreferrer">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        www.eternalproduction.net
    </a>

    <a class="instagram"
       href="https://www.instagram.com/eternalproductiontr/"
       target="_blank"
       rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>
        @eternalproductiontr
    </a>

    <div class="footer">
        © 2026 Eternal Production. Tüm hakları saklıdır.
    </div>

</main>

</body>
</html>
