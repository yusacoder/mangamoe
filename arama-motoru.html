<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arama Motoru — Manga Moe</title>
  <link rel="icon" href="logo1-removebg-preview.png" type="image/png">
  <meta name="description" content="Manga Moe arama motoru ile manga, webtoon ve haberleri keşfedin.">
  <link rel="stylesheet" href="style.css">
  <style>
    .search-container {
      padding: 40px 0;
      min-height: 60vh;
    }
    .search-box-wrapper {
      max-width: 600px;
      margin: 0 auto 32px;
      text-align: center;
    }
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .category-tab {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--white-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    .category-tab.active {
      background: var(--purple);
      border-color: var(--purple);
      color: var(--white);
      box-shadow: 0 0 12px var(--purple-glow);
    }
    .search-input-group {
      position: relative;
    }
    .search-input-group input {
      width: 100%;
      height: 50px;
      background: var(--black-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0 50px 0 20px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 16px;
      outline: none;
      transition: var(--transition);
    }
    .search-input-group input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-glow-soft);
    }
    .search-input-group svg {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--purple);
    }
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .no-results {
      text-align: center;
      color: var(--white-muted);
      padding: 40px;
      font-size: 18px;
    }
    @media (max-width: 768px) {
      .category-tabs {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <!-- DRAWER OVERLAY -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- DRAWER -->
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="nav-logo">
        <img src="maskot1.jpeg" class="logo-icon" alt="mascot">
        <span class="logo-text">Manga <span>Moe</span></span>
      </div>
      <button class="drawer-close" id="drawer-close" style="margin-left:auto" aria-label="Kapat">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="drawer-body">
      <span class="drawer-label">Menü</span>
      <ul class="drawer-nav">
        <li>
          <a href="index.html">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Ana Sayfa
          </a>
        </li>
        <li>
          <a href="haberler.html">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>
            Haberler
          </a>
        </li>
        <li>
          <a href="admin.html">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Adminler
          </a>
        </li>
      </ul>
    </div>
    <div class="drawer-footer">
      <button class="btn-ghost modal-trigger">Giriş Yap</button>
      <button class="btn-primary modal-trigger">Kayıt Ol</button>
    </div>
  </aside>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <button class="hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
      <a href="index.html" class="nav-logo">
        <span class="logo-text">Manga <span>Moe</span></span>
      </a>
      <div class="nav-actions" style="margin-left: auto;">
        <a href="haberler.html" class="nav-link">Haberler</a>
        <button class="btn-ghost modal-trigger">Giriş Yap</button>
        <button class="btn-primary modal-trigger">Kayıt Ol</button>
        <a href="arama-motoru.html" class="nav-search-btn" aria-label="Ara">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="page-header-inner">
      <div>
        <div class="page-header-label">Arama</div>
        <h1 class="page-header-title">Moe <span>Arama</span></h1>
      </div>
    </div>
  </header>

  <main class="container search-container">
    <div class="search-box-wrapper">
      <div class="category-tabs" id="category-tabs">
        <div class="category-tab" data-cat="manga">Manga</div>
        <div class="category-tab" data-cat="webtoon">Webtoon</div>
        <div class="category-tab active" data-cat="haberler">Haberler</div>
      </div>
      <div class="search-input-group">
        <input type="text" id="search-input" placeholder="Aramak istediğiniz başlığı yazın...">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div id="search-results" class="search-results">
      <!-- Sonuçlar buraya gelecek -->
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-logo">Manga <span>Moe</span></div>
      <p class="footer-text">© 2026 Manga Moe. Tüm hakları saklıdır.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const searchInput = document.getElementById('search-input');
      const resultsContainer = document.getElementById('search-results');
      const categoryTabs = document.querySelectorAll('.category-tab');
      let currentCategory = 'haberler';
      let newsData = [];

      // Fetch news data
      try {
        const res = await fetch('data.json');
        newsData = await res.json();
      } catch (err) {
        console.error('Haberler yüklenemedi:', err);
      }

      function renderResults(results) {
        if (results.length === 0) {
          resultsContainer.innerHTML = '<div class="no-results">Arama sonucu yok.</div>';
          return;
        }

        resultsContainer.innerHTML = results.map(item => `
          <article class="news-card animate-in" onclick="window.location.href='haber-detay.html?id=${item.id}'">
            <div class="card-image">
              <img src="${item.image}" alt="${item.title}" loading="lazy">
              <div class="card-image-overlay"></div>
            </div>
            <div class="card-body">
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.desc}</p>
              <div class="card-footer">
                 <button class="btn-card">Haberi Oku</button>
              </div>
            </div>
          </article>
        `).join('');
      }

      function performSearch() {
        const query = searchInput.value.toLowerCase().trim();

        if (currentCategory !== 'haberler') {
          resultsContainer.innerHTML = '<div class="no-results">Şu an sadece Haberler kısmında arama yapabilirsiniz.</div>';
          return;
        }

        if (query === '') {
          resultsContainer.innerHTML = '';
          return;
        }

        const filtered = newsData.filter(item => 
          item.title.toLowerCase().includes(query)
        );

        renderResults(filtered);
      }

      searchInput.addEventListener('input', performSearch);

      categoryTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          categoryTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentCategory = tab.dataset.cat;
          performSearch();
        });
      });
    });
  </script>
</body>
</html>
