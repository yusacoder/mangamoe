<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

/* ANİME ARKA PLAN */

.anime-background {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    gap: 22px;
    padding: 0 20px;
    overflow: hidden;
    z-index: 0;
}

.anime-column {
    flex: 1;
    max-width: 350px;
    overflow: hidden;
}

.anime-track {
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: scrollUp 65s linear infinite;
}

.anime-column:nth-child(2) .anime-track {
    animation-direction: reverse;
    animation-duration: 75s;
}

.anime-column:nth-child(3) .anime-track {
    animation-duration: 85s;
}

.anime-track img {
    display: block;
    width: 100%;
    height: 390px;
    object-fit: cover;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.12);
    opacity: .55;
    filter: grayscale(10%);
    transition: opacity .4s;
}

.anime-track img:hover {
    opacity: .9;
}

@keyframes scrollUp {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-50%);
    }
}

/* SİYAH GEÇİŞLER */

.anime-background::before,
.anime-background::after {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    height: 180px;
    z-index: 2;
    pointer-events: none;
}

.anime-background::before {
    top: 0;
    background: linear-gradient(to bottom, #050505, transparent);
}

.anime-background::after {
    bottom: 0;
    background: linear-gradient(to top, #050505, transparent);
}

/* ORTADAKİ İÇERİK */

.main-content {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 60px 25px;
    text-align: center;

    background: rgba(0,0,0,.12);
}

/* LOGO */

.brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 65px;
    text-decoration: none;
    color: white;
}

.brand-icon {
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    border-radius: 19px;
    background: linear-gradient(145deg,#222,#080808);
    border: 1px solid rgba(255,255,255,.2);
    font-size: 32px;
}

.brand-text {
    text-align: left;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
}

.brand-text small {
    display: block;
    font-size: 10px;
    letter-spacing: 4px;
    color: #aaa;
    margin-top: 7px;
}

/* DUYURU */

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    margin-bottom: 30px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 30px;
    background: rgba(0,0,0,.45);
    color: #eee;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
}

h1 {
    font-size: clamp(45px, 7vw, 85px);
    line-height: 1.12;
    letter-spacing: -4px;
    font-weight: 900;
    text-shadow: 0 5px 25px #000;
    margin-bottom: 28px;
}

h1 span {
    color: #c7c7c7;
}

.description {
    font-size: 17px;
    line-height: 2;
    color: #eee;
    text-shadow: 0 3px 12px #000;
    margin-bottom: 40px;
}

/* WEB SİTESİ */

.website {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    min-width: 370px;
    padding: 22px 35px;

    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.35);

    background: rgba(10,10,10,.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: 800;

    transition: .3s;

    user-select: text;
    -webkit-user-select: text;
}

.website:hover {
    background: rgba(255,255,255,.15);
    border-color: white;
    transform: translateY(-4px);
}

.website span {
    user-select: text;
    -webkit-user-select: text;
}

/* INSTAGRAM */

.instagram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;

    margin-top: 30px;
    padding: 12px 20px;

    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;

    transition: .3s;
}

.instagram i {
    font-size: 23px;
}

.instagram:hover {
    opacity: .7;
    transform: translateY(-3px);
}

/* FOOTER */

.footer {
    margin-top: 65px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #aaa;
}

/* MOBİL */

@media(max-width: 600px) {

    .anime-background {
        gap: 10px;
        padding: 0 7px;
    }

    .anime-column:nth-child(3) {
        display: none;
    }

    .anime-track img {
        height: 240px;
        border-radius: 10px;
    }

    .main-content {
        padding: 35px 18px;
    }

    .brand {
        margin-bottom: 45px;
        gap: 12px;
    }

    .brand-icon {
        width: 53px;
        height: 53px;
        font-size: 25px;
    }

    .brand-text {
        font-size: 16px;
    }

    .brand-text small {
        font-size: 8px;
    }

    h1 {
        font-size: 44px;
        letter-spacing: -2px;
    }

    .description {
        font-size: 14px;
    }

    .website {
        width: 100%;
        min-width: 0;
        max-width: 360px;
        padding: 19px 12px;
        font-size: 13px;
    }

    .instagram {
        font-size: 13px;
    }

    .footer {
        margin-top: 45px;
    }
}

/* HAREKET AZALTMA */

@media(prefers-reduced-motion: reduce) {
    .anime-track {
        animation: none;
    }
}
</style>
</head>
