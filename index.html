<title>Manga Moe | Eternal Production</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    overflow-x: hidden;
    background: #08070d;
    font-family: 'Inter', sans-serif;
    color: white;
}

/* ARKA PLAN */

.background-glow {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 15%, rgba(117,54,180,.25), transparent 55%),
        radial-gradient(ellipse at 10% 90%, rgba(110,25,90,.13), transparent 45%);
    pointer-events: none;
    z-index: 1;
}

/* ANIME GALERİ KUTUSU */

.anime-gallery {
    position: fixed;
    inset: 20px;
    z-index: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    overflow: hidden;
    padding: 20px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    background: rgba(255,255,255,.025);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: .8;
}

.anime-column {
    flex: 1;
    max-width: 270px;
    overflow: hidden;
    position: relative;
}

.anime-track {
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: animeScroll 55s linear infinite;
}

.anime-column:nth-child(2) .anime-track {
    animation-direction: reverse;
    animation-duration: 65s;
}

.anime-column:nth-child(3) .anime-track {
    animation-duration: 70s;
}

.anime-track img {
    width: 100%;
    height: 310px;
    object-fit: cover;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.15);
    opacity: .65;
    filter: saturate(.8);
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
    transition: .4s;
}

.anime-track img:hover {
    opacity: 1;
    filter: saturate(1.2);
    transform: scale(1.02);
}

@keyframes animeScroll {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-50%);
    }
}

/* ÜST ALT KARARTMA */

.anime-gallery::before,
.anime-gallery::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 120px;
    z-index: 3;
    pointer-events: none;
}

.anime-gallery::before {
    top: 0;
    background: linear-gradient(#08070d, transparent);
}

.anime-gallery::after {
    bottom: 0;
    background: linear-gradient(transparent, #08070d);
}

/* DUYURU KARTI */

.announcement {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 570px;
    padding: 50px 38px;
    text-align: center;

    background: rgba(13,11,21,.78);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 26px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 60px rgba(126,65,190,.08);
}

/* LOGO */

.brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin-bottom: 40px;
    color: white;
    text-decoration: none;
}

.brand-symbol {
    width: 53px;
    height: 53px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: linear-gradient(135deg,#a855f7,#6d28d9);
    box-shadow: 0 8px 30px rgba(147,51,234,.3);
    font-size: 25px;
}

.brand-text {
    text-align: left;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.brand-text small {
    display: block;
    margin-top: 5px;
    color: #b89aff;
    font-size: 9px;
    letter-spacing: 3px;
}

/* BİLGİLENDİRME */

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    margin-bottom: 24px;
    border-radius: 30px;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.22);
    color: #ff8585;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

/* BAŞLIK */

h1 {
    font-size: clamp(30px,6vw,43px);
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: -1.5px;
    margin-bottom: 18px;
}

h1 span {
    color: #b58aff;
}

.description {
    color: #aaa6b5;
    font-size: 14px;
    line-height: 1.9;
    margin-bottom: 32px;
}

/* WEB SİTESİ */

.website {
    width: 100%;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 17px;
    border-radius: 14px;

    background: linear-gradient(100deg,#7c3aed,#9333ea);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 800;

    box-shadow: 0 10px 35px rgba(124,58,237,.25);
    transition: .3s;

    user-select: text;
    -webkit-user-select: text;
}

.website:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(124,58,237,.4);
}

.website span {
    user-select: text;
    -webkit-user-select: text;
}

/* INSTAGRAM */

.instagram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
    padding: 12px 18px;

    color: #ded1f8;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: .3s;
}

.instagram i {
    font-size: 21px;
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.instagram:hover {
    color: white;
    transform: translateY(-2px);
}

/* ALT BİLGİ */

.footer {
    margin-top: 35px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.09);
    color: #777282;
    font-size: 11px;
    letter-spacing: .5px;
}

/* MOBİL */

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .anime-gallery {
        inset: 8px;
        gap: 10px;
        padding: 10px;
        opacity: .55;
    }

    .anime-column {
        min-width: 0;
    }

    .anime-column:nth-child(3) {
        display: none;
    }

    .anime-track img {
        height: 220px;
        border-radius: 12px;
    }

    .announcement {
        padding: 38px 23px;
    }

    .brand {
        margin-bottom: 32px;
    }

    .brand-text {
        font-size: 14px;
    }

    .website {
        font-size: 13px;
    }
}

/* ANİMASYONU AZALTMA TERCİHİ */

@media(prefers-reduced-motion: reduce) {
    .anime-track {
        animation: none;
    }

    * {
        transition: none !important;
    }
}
</style>
</head>
